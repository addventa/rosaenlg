name: New Version Production For Security Campaigns

on:
  workflow_dispatch:
    inputs:
      target-branch:
        description: 'Target branch for the security campaign'
        required: true
        type: string
        default: 'codeql-advanced-configuration'

  pull_request:
    types: [closed]
    branches:
      - codeql-advanced-configuration
      
env:
  TARGET_BRANCH: 'codeql-advanced-configuration'

permissions:
  contents: write
  security-events: write
  issues: write
  pull-requests: write
  actions: read
  packages: write

jobs:
  compute-and-release:
    name: Compute Version and Trigger Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Get current version
        id: current-version
        uses: addventa/.github/.github/actions/release/get_current_version@v3
      - name: Compute next version
        id: next-version
        uses: addventa/.github/.github/actions/release/compute_next_version@v3
        with:
          base-version: ${{ steps.current-version.outputs.base-version }}
          current-major: ${{ steps.current-version.outputs.major }}
          current-minor: ${{ steps.current-version.outputs.minor }}
          current-patch: ${{ steps.current-version.outputs.patch }}

      - name: Determine release branch
        id: release-branch
        run: |
          NEXT_VERSION="${{ steps.next-version.outputs.next-version }}"
          STRATEGY="${{ steps.next-version.outputs.version-strategy }}"
          MAJOR="${{ steps.current-version.outputs.major }}"
          MINOR="${{ steps.current-version.outputs.minor }}"
          NEXT_PATCH="${{ steps.next-version.outputs.next-patch }}"
          NEXT_RC="${{ steps.next-version.outputs.next-rc }}"
          NEXT_REV="${{ steps.next-version.outputs.next-revision }}"
          
          echo "Next version: ${NEXT_VERSION}"
          echo "Strategy: ${STRATEGY}"
          echo "RC: ${NEXT_RC:-none}, Revision: ${NEXT_REV:-none}"
          
          if [ "$STRATEGY" == "revision" ]; then
            # Revision strategy: branch is release/X.Y-rev.N
            # The version itself may include RC (vX.Y.Z-rc.N-rev.R) but branch doesn't
            RELEASE_BRANCH="release/${MAJOR}.${MINOR}-rev.${NEXT_REV}"
            echo "release-branch=${RELEASE_BRANCH}" >> $GITHUB_OUTPUT
            echo "Will push to revision branch: ${RELEASE_BRANCH} (version: ${NEXT_VERSION})"
          else
            # Patch strategy: branch is release/X.Y for the new patch RC
            # e.g., release/2.13 for v2.13.5-rc.1
            RELEASE_BRANCH="release/${MAJOR}.${MINOR}"
            echo "release-branch=${RELEASE_BRANCH}" >> $GITHUB_OUTPUT
            echo "Will push to patch branch: ${RELEASE_BRANCH}"
          fi

      - name: Setup release branch and push
        env:
          RELEASE_BRANCH: ${{ steps.release-branch.outputs.release-branch }}
          NEXT_VERSION: ${{ steps.next-version.outputs.next-version }}
          SOURCE_BRANCH: ${{ env.TARGET_BRANCH }}
        run: |
          git config user.name "addventa-github-actions[bot]"
          git config user.email "addventa-github-actions[bot]@addventa.com"
          
          # Check if release branch exists remotely
          if git ls-remote --heads origin "${RELEASE_BRANCH}" | grep -q "${RELEASE_BRANCH}"; then
            echo "Branch ${RELEASE_BRANCH} exists, checking out..."
            git checkout "${RELEASE_BRANCH}"
            git pull origin "${RELEASE_BRANCH}"
            
            # Merge changes from source branch
            git merge "${SOURCE_BRANCH}" --no-ff -m "Merge ${SOURCE_BRANCH} security fixes for v${NEXT_VERSION}"
          else
            echo "Branch ${RELEASE_BRANCH} does not exist, creating from ${SOURCE_BRANCH}..."
            git checkout -b "${RELEASE_BRANCH}"
          fi
          
          # Push the branch - this will trigger release.yml
          git push origin "${RELEASE_BRANCH}"
          
          echo "Pushed to ${RELEASE_BRANCH} - release workflow will handle versioning and tagging"

      # ── Issue tracing: tag campaign issues with the planned revision ──────────
      # Only runs when the push produced a revision branch (revision strategy).
      # Uses mark-planned (initial mode) which writes "planned-rev:vX.Y.Z-rev.R"
      # instead of the legacy "pending-rev". The cascade_patch_release workflow
      # will swap this to "in-rev" once the revision is released and its own
      # cascade targets have been registered as planned-rev.

      - name: Get Campaign Info (for issue tracking)
        id: campaign-info
        if: steps.next-version.outputs.version-strategy == 'revision'
        uses: addventa/.github/.github/actions/campaign/get_campaign_info@v3
      - name: Tag campaign issues with planned revision
        if: steps.next-version.outputs.version-strategy == 'revision'
        uses: addventa/.github/.github/actions/release/trace_revision_issues@v3
        with:
          operation: mark-planned
          campaign-label: ${{ steps.campaign-info.outputs.campaign-label }}
          forced-version: ${{ steps.next-version.outputs.forced-version }}

      # Branch is now pushed — transition planned-rev → pending-rev to signal
      # that the RC is building. cascade_patch_release will swap to in-rev once
      # the final revision tag is released and its cascade targets registered.
      - name: Transition campaign issues to pending-rev
        if: steps.next-version.outputs.version-strategy == 'revision'
        uses: addventa/.github/.github/actions/release/trace_revision_issues@v3
        with:
          operation:      mark-pending
          forced-version: ${{ steps.next-version.outputs.forced-version }}


